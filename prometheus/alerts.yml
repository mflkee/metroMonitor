groups:
  - name: monitoring-stack
    rules:
      - alert: MonitoringScrapeTargetDown
        expr: up{job=~"prometheus|alertmanager|node-exporter|cadvisor|blackbox-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Monitoring target down: {{ $labels.job }}"
          description: "Prometheus cannot scrape {{ $labels.job }} on {{ $labels.instance }} for more than 2 minutes."

  - name: host-health
    rules:
      - alert: HostHighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU usage is high"
          description: "Average CPU usage on {{ $labels.instance }} has been above 85% for 10 minutes."

      - alert: HostHighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory pressure is high"
          description: "Memory usage on {{ $labels.instance }} has been above 90% for 10 minutes."

      - alert: HostRootFilesystemUsageWarning
        expr: ((1 - (node_filesystem_avail_bytes{mountpoint="/", fstype!=""} / node_filesystem_size_bytes{mountpoint="/", fstype!=""})) * 100 > 70) and (node_filesystem_readonly{mountpoint="/", fstype!=""} == 0)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Root filesystem usage is above 70%"
          description: "Root filesystem usage on {{ $labels.instance }} has been above 70% for 10 minutes."

      - alert: HostRootFilesystemUsageHigh
        expr: ((1 - (node_filesystem_avail_bytes{mountpoint="/", fstype!=""} / node_filesystem_size_bytes{mountpoint="/", fstype!=""})) * 100 > 85) and (node_filesystem_readonly{mountpoint="/", fstype!=""} == 0)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Root filesystem usage is high"
          description: "Root filesystem usage on {{ $labels.instance }} has been above 85% for 15 minutes."

      - alert: HostBootFilesystemUsageHigh
        expr: ((1 - (node_filesystem_avail_bytes{mountpoint="/boot", fstype!=""} / node_filesystem_size_bytes{mountpoint="/boot", fstype!=""})) * 100 > 80) and (node_filesystem_readonly{mountpoint="/boot", fstype!=""} == 0)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Boot filesystem usage is high"
          description: "Boot filesystem usage on {{ $labels.instance }} has been above 80% for 15 minutes."

      - alert: HostHighTemperature
        expr: max(node_hwmon_temp_celsius{job="node-exporter", chip=~"platform_coretemp_0|thermal_thermal_zone0"}) > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host temperature is high"
          description: "Max CPU temperature on {{ $labels.instance }} has been above 70°C for 5 minutes."

      - alert: HostCriticalTemperature
        expr: max(node_hwmon_temp_celsius{job="node-exporter", chip=~"platform_coretemp_0|thermal_thermal_zone0"}) > 80
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Host temperature is critical"
          description: "Max CPU temperature on {{ $labels.instance }} has been above 80°C for 5 minutes."

      - alert: HostLoad15High
        expr: node_load15 / on(instance, job) group_left count without(cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 1.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Host load average is high"
          description: "15-minute load average on {{ $labels.instance }} is above 1.5 per CPU core."

  - name: app-probes
    rules:
      - alert: AppHttpProbeFailed
        expr: probe_success{job=~"blackbox-http|blackbox-http-stg|mail-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP probe failed: {{ $labels.probe_name }}"
          description: "Blackbox HTTP probe {{ $labels.probe_name }} for service {{ $labels.service }} (env: {{ $labels.env }}) is failing."

      - alert: AppTcpProbeFailed
        expr: probe_success{job=~"blackbox-tcp|blackbox-tcp-stg|mail-tcp"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "TCP probe failed: {{ $labels.probe_name }}"
          description: "Blackbox TCP probe {{ $labels.probe_name }} for service {{ $labels.service }} (env: {{ $labels.env }}) is failing."

      - alert: MetroLogReadinessFailed
        expr: probe_success{job="blackbox-http", probe_name="metrolog_ready"} == 0
        for: 1m
        labels:
          severity: critical
          service: metroLog
        annotations:
          summary: "metroLog readiness probe failed"
          description: "metroLog /api/v1/health/ready is failing."

      - alert: ProdServiceAllEndpointsDown
        expr: count by (service) (probe_success{job=~"blackbox-http|blackbox-tcp|mail-http|mail-tcp", env!="staging"} == 0) == count by (service) (probe_success{job=~"blackbox-http|blackbox-tcp|mail-http|mail-tcp", env!="staging"})
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "All prod endpoints down for service: {{ $labels.service }}"
          description: "All HTTP/TCP probes for service {{ $labels.service }} are failing for more than 3 minutes. The service is likely down entirely."

  - name: external-deps
    rules:
      # Доступность ФГИС «Аршин» — внешней зависимости metroLog.
      # Условие срабатывания: проба не проходит непрерывно 5 минут (`for: 5m`).
      # `keep_firing_for: 2m` держит алерт в firing ещё 2 минуты после
      # восстановления связи: если Аршин снова отвалится в этом окне, алерт не
      # закроется и уведомление о восстановлении не уйдёт — то есть «восстановлено»
      # отправляется только после 2 минут стабильной доступности.
      - alert: ArshinUnavailable
        expr: probe_success{job="arshin-http"} == 0
        for: 5m
        keep_firing_for: 2m
        labels:
          severity: critical
          service: arshin
        annotations:
          summary: "ФГИС «Аршин» не отвечает"
          description: "Проба {{ $labels.probe_name }} ({{ $labels.instance }}) к API ФГИС «Аршин» не проходит уже более 5 минут: поиск, просмотр и импорт СИ/ЭСИ в metroLog недоступны. О восстановлении придёт отдельное уведомление после 2 минут стабильной доступности."
