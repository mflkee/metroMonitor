groups:
  - name: monitoring-stack
    rules:
      - alert: MonitoringScrapeTargetDown
        expr: up{job=~"prometheus|alertmanager|node-exporter|cadvisor|blackbox-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Monitoring target down: {{ $labels.job }}"
          description: "Prometheus cannot scrape {{ $labels.job }} on {{ $labels.instance }} for more than 2 minutes."

  - name: host-health
    rules:
      - alert: HostHighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU usage is high"
          description: "Average CPU usage on {{ $labels.instance }} has been above 85% for 10 minutes."

      - alert: HostHighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory pressure is high"
          description: "Memory usage on {{ $labels.instance }} has been above 90% for 10 minutes."

      - alert: HostRootFilesystemUsageHigh
        expr: ((1 - (node_filesystem_avail_bytes{mountpoint="/", fstype!=""} / node_filesystem_size_bytes{mountpoint="/", fstype!=""})) * 100 > 85) and (node_filesystem_readonly{mountpoint="/", fstype!=""} == 0)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Root filesystem usage is high"
          description: "Root filesystem usage on {{ $labels.instance }} has been above 85% for 15 minutes."

      - alert: HostLoad15High
        expr: node_load15 / on(instance, job) group_left count without(cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 1.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Host load average is high"
          description: "15-minute load average on {{ $labels.instance }} is above 1.5 per CPU core."

  - name: app-probes
    rules:
      - alert: AppHttpProbeFailed
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP probe failed: {{ $labels.probe_name }}"
          description: "Blackbox HTTP probe {{ $labels.probe_name }} for service {{ $labels.service }} is failing."

      - alert: AppTcpProbeFailed
        expr: probe_success{job="blackbox-tcp"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "TCP probe failed: {{ $labels.probe_name }}"
          description: "Blackbox TCP probe {{ $labels.probe_name }} for service {{ $labels.service }} is failing."

      - alert: MetroLogReadinessFailed
        expr: probe_success{job="blackbox-http", probe_name="metrolog_ready"} == 0
        for: 1m
        labels:
          severity: critical
          service: metroLog
        annotations:
          summary: "metroLog readiness probe failed"
          description: "metroLog /api/v1/health/ready is failing."
