global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    server: mkair-tmn

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://host.docker.internal:5173/
        labels:
          service: metroLog
          probe_name: metrolog_frontend
      - targets:
          - http://host.docker.internal:8000/api/v1/health
        labels:
          service: metroLog
          probe_name: metrolog_health
      - targets:
          - http://host.docker.internal:8000/api/v1/health/ready
        labels:
          service: metroLog
          probe_name: metrolog_ready
      - targets:
          - http://host.docker.internal:5174/
        labels:
          service: metroGen
          probe_name: metrogen_frontend
      - targets:
          - http://host.docker.internal:8001/docs
        labels:
          service: metroGen
          probe_name: metrogen_docs
      - targets:
          - http://host.docker.internal:8001/api/v1/resolve/status
        labels:
          service: metroGen
          probe_name: metrogen_resolve_status
      - targets:
          - http://host.docker.internal:8002/health
        labels:
          service: metroCheck
          probe_name: metrocheck_health
      - targets:
          - https://auth.mkair-it.ru/
        labels:
          service: metroAuth
          probe_name: metroauth_frontend
      - targets:
          - http://host.docker.internal:8006/api/v1/health
        labels:
          service: metroAuth
          probe_name: metroauth_health

    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module:
        - tcp_connect
    static_configs:
      - targets:
          - host.docker.internal:5432
        labels:
          service: metroLog
          probe_name: metrolog_postgres
      - targets:
          - host.docker.internal:6379
        labels:
          service: metroLog
          probe_name: metrolog_redis
      - targets:
          - host.docker.internal:5433
        labels:
          service: metroGen
          probe_name: metrogen_postgres
      - targets:
          - host.docker.internal:5434
        labels:
          service: metroCheck
          probe_name: metrocheck_postgres
      - targets:
          - host.docker.internal:6382
        labels:
          service: metroCheck
          probe_name: metrocheck_redis
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ── Stage (staging) probes ──────────────────────────────

  - job_name: blackbox-http-stg
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://host.docker.internal:9002/health
        labels:
          service: metroCheck
          env: staging
          probe_name: metrocheck_stg_health
      - targets:
          - http://host.docker.internal:9002/health/live
        labels:
          service: metroCheck
          env: staging
          probe_name: metrocheck_stg_live
      - targets:
          - http://host.docker.internal:9081/
        labels:
          service: metroCheck
          env: staging
          probe_name: metrocheck_stg_frontend
      - targets:
          - http://host.docker.internal:9001/api/v1/resolve/status
        labels:
          service: metroGen
          env: staging
          probe_name: metrogen_stg_resolve_status
      - targets:
          - http://host.docker.internal:9001/docs
        labels:
          service: metroGen
          env: staging
          probe_name: metrogen_stg_docs
      - targets:
          - http://host.docker.internal:9174/
        labels:
          service: metroGen
          env: staging
          probe_name: metrogen_stg_frontend

      - targets:
          - http://host.docker.internal:9186/
        labels:
          service: metroAuth
          env: staging
          probe_name: metroauth_stg_frontend
      - targets:
          - http://host.docker.internal:9006/api/v1/health
        labels:
          service: metroAuth
          env: staging
          probe_name: metroauth_stg_health
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-tcp-stg
    metrics_path: /probe
    params:
      module:
        - tcp_connect
    static_configs:
      - targets:
          - host.docker.internal:5436
        labels:
          service: metroCheck
          env: staging
          probe_name: metrocheck_stg_postgres
      - targets:
          - host.docker.internal:6383
        labels:
          service: metroCheck
          env: staging
          probe_name: metrocheck_stg_redis
      - targets:
          - host.docker.internal:5437
        labels:
          service: metroGen
          env: staging
          probe_name: metrogen_stg_postgres

    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ── Mail / Cloud Stack ──────────────────────────────────

  - job_name: mail-http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - https://mail.mkair-it.ru/login
        labels:
          service: mail
          probe_name: stalwart
      - targets:
          - https://mail.mkair-it.ru/.well-known/oauth-authorization-server
        labels:
          service: mail
          probe_name: stalwart_oauth
      - targets:
          - https://webmail.mkair-it.ru/
        labels:
          service: mail
          probe_name: bulwark
      - targets:
          - https://cloud.mkair-it.ru/
        labels:
          service: mail
          probe_name: nextcloud
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: mail-tcp
    metrics_path: /probe
    params:
      module:
        - tcp_connect
    static_configs:
      - targets:
          - host.docker.internal:993
        labels:
          service: mail
          probe_name: imaps
      - targets:
          - host.docker.internal:465
        labels:
          service: mail
          probe_name: smtps
      - targets:
          - host.docker.internal:587
        labels:
          service: mail
          probe_name: submission
      - targets:
          - host.docker.internal:143
        labels:
          service: mail
          probe_name: imap
      - targets:
          - host.docker.internal:80
        labels:
          service: mail
          probe_name: npm_http
      - targets:
          - host.docker.internal:81
        labels:
          service: mail
          probe_name: npm_admin
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ── Внешние зависимости (ФГИС «Аршин») ───────────────────
  # Проба повторяет проверку доступности из metroLog
  # (`ArshinClient.check_availability`: GET /fundmetrology/eapi/vri?rows=1&start=0;
  # metroLog по этому же ответу показывает статус Аршина в топбаре).
  # Аршин отвечает нестабильно (то 0.2 s, то зависание >30 s), поэтому у пробы
  # длинный таймаут (module http_2xx_slow) и интервал раз в минуту, а алерт
  # требует непрерывного провала в течение 5 минут.
  - job_name: arshin-http
    metrics_path: /probe
    scrape_interval: 1m
    scrape_timeout: 35s
    params:
      module:
        - http_2xx_slow
    static_configs:
      - targets:
          - https://fgis.gost.ru/fundmetrology/eapi/vri?rows=1&start=0
        labels:
          service: arshin
          probe_name: arshin_eapi_vri
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
